[project]
name = "pbip"
version = "0.1.0"
description = "Fabric CI/CD deployment scripts for Power BI PBIP projects"
readme = "docs/setup.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "fabric-cicd>=1.3.0,<1.4.0",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
